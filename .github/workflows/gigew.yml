name: Automatizare Stream - Programat

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  LANG: "en_US.UTF-8"

jobs:
  automatizare-stream:
    name: Rulare Automatizare Browser

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest]


    steps:

    # =========================================
    # CHECKOUT COD
    # =========================================
    - name: Checkout repository
      uses: actions/checkout@v4

    # =========================================
    # SETUP PYTHON
    # =========================================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Verificare versiune Python
      run: python --version

    # =========================================
    # CONFIGURARE LOCALE
    # =========================================
    - name: Configurare locale sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y tzdata locales
        sudo locale-gen en_US.UTF-8
        sudo update-locale LANG=en_US.UTF-8
        locale

    # =========================================
    # INSTALARE CLOUDFLARE WARP
    # =========================================
    - name: Instalare Cloudflare WARP
      run: |
        echo "Instalare Cloudflare WARP..."
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
          | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg

        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] \
        https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
        | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

        sudo apt-get update
        sudo apt-get install -y cloudflare-warp

        sudo warp-cli --accept-tos registration new
        sudo warp-cli --accept-tos mode warp+doh
        sudo warp-cli --accept-tos connect

        sleep 5

    - name: Verificare conexiune WARP
      run: |
        echo "Verificare conexiune WARP..."
        curl -s https://www.cloudflare.com/cdn-cgi/trace | grep "warp=on"

    # =========================================
    # INSTALARE BRAVE BROWSER
    # =========================================
    - name: Instalare Brave Browser
      run: |
        echo "Instalare Brave Browser..."
        sudo apt-get install -y curl

        sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
          https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg

        echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] \
        https://brave-browser-apt-release.s3.brave.com/ stable main" \
        | sudo tee /etc/apt/sources.list.d/brave-browser-release.list

        sudo apt-get update
        sudo apt-get install -y brave-browser

    - name: Verificare instalare Brave
      run: brave-browser --version

    # =========================================
    # INSTALARE DEPENDINȚE PYTHON
    # =========================================
    - name: Instalare dependințe Python
      run: |
        python -m pip install --upgrade pip wheel
        pip install --upgrade seleniumbase
        pip install --upgrade pyautogui
        pip install --upgrade pymongo
        pip install --upgrade python-xlib

    # =========================================
    # INSTALARE CHROMEDRIVER
    # =========================================
    - name: Instalare ChromeDriver prin SeleniumBase
      run: seleniumbase install chromedriver

    # =========================================
    # RULARE SCRIPT
    # =========================================
    - name: Rulare script automatizare
      run: |
        python fritz.py \
          --brave \
          --incognito \
          --do-not-track \
          --xvfb \
          --screenshot
